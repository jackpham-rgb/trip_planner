<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5f4a">
<title>Trip Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>What should I do?</h1>
</header>

<main id="app">
  <form id="intake-form">
    <label>
      Trip type
      <select name="trip_type" id="trip_type">
        <option value="hangout_nearby">Just hanging out nearby</option>
        <option value="day_trip">Day trip</option>
        <option value="long_trip">Long trip</option>
        <option value="custom">Custom duration</option>
      </select>
    </label>

    <label>
      Energy level
      <select name="energy">
        <option value="0.1">Wiped out</option>
        <option value="0.3">Kind of tired</option>
        <option value="0.5" selected>Normal</option>
        <option value="0.7">Good energy</option>
        <option value="0.9">Wired / raring to go</option>
      </select>
    </label>

    <label>
      Budget
      <select name="budget_level" id="budget_level"></select>
    </label>

    <label>
      Who's coming
      <select name="party">
        <option value="solo">Solo</option>
        <option value="partner">Partner</option>
        <option value="friends">Friends</option>
        <option value="family">Family</option>
      </select>
    </label>

    <label>
      Indoor / outdoor
      <select name="indoor_outdoor">
        <option value="-1">Indoor</option>
        <option value="0" selected>No preference</option>
        <option value="1">Outdoor</option>
      </select>
    </label>

    <label>
      Mood
      <select name="mood_adventurous">
        <option value="-1">Relaxed</option>
        <option value="0" selected>No preference</option>
        <option value="1">Adventurous</option>
      </select>
    </label>

    <label id="hours-field" hidden>
      Time budget (hours)
      <input type="number" name="budget_hours" min="1" step="0.5" value="8">
    </label>

    <div class="actions">
      <button type="button" id="btn-suggest">Suggest something</button>
      <button type="button" id="btn-plan">Plan a trip</button>
    </div>
  </form>

  <section id="results"></section>
</main>

<template id="suggestion-card">
  <article class="card">
    <h3 class="label"></h3>
    <p class="meta"></p>
    <p class="why"></p>
    <div class="feedback">
      <button data-action="accepted_repeat">Did it, would repeat</button>
      <button data-action="accepted_no_repeat">Did it, wouldn't repeat</button>
      <button data-action="skipped">Skip</button>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
