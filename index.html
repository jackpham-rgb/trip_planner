<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5f4a">
<title>Trip Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>What should I do?</h1>
  <p id="context-note"></p>
</header>

<main id="app">
  <div id="wizard" class="panel"></div>
  <section id="results"></section>
</main>

<template id="suggestion-card">
  <article class="card">
    <h3 class="label"></h3>
    <p class="meta"></p>
    <p class="why"></p>
    <div class="feedback">
      <button type="button" data-open-log>Log what happened</button>
    </div>
    <div class="log-flow" hidden></div>
  </article>
</template>

<script src="recommender.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
